[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noted"
version = "0.1.0"
description = "Appunti giornalieri con recap AI"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "pytest>=8.0",
    "typer[all]>=0.12",
    "sqlmodel>=0.0.19",
    "anthropic>=0.25",
    "rich>=13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "platformdirs>=4.0",
    "openai-whisper>=20231117",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
tray = ["rumps>=0.4", "pynput>=1.7"]

[project.scripts]
noted = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
